services:
  postgresDB:
    image: postgres:15 # you can update it to the latest this is the version i have so i want to re-use it.
    container_name: postgresql
    ports:
      - "5432:5432"
    env_file:
      - .env.prod
    networks:
      - drf_network
    volumes:
      - postgres-data:/var/lib/postgresql/data

  drf-backend:
    build: .
    container_name: drf_backend
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    networks:
      - drf_network
    depends_on:
      - postgresDB

networks:
  drf_network:
    driver: bridge

volumes:
  postgres-data:
